name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-cpp:
    name: C++ tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC dev environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.69.0
          cache: true

      - name: Build
        run: pixi run build

      - name: Run C++ tests
        run: pixi run test

  test-python:
    name: Python tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC dev environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.69.0
          cache: true

      - name: Run Python tests
        # scikit-build-core's default CMake generator selection on Windows
        # guesses a Visual Studio version by name, which can mismatch
        # whatever VS version is actually on the runner and fail configure.
        # Force Ninja for this CI job only via CMAKE_ARGS (not
        # pyproject.toml's cmake.args, since that file also drives
        # publish.yml's cibuildwheel build - forcing Ninja there changed the
        # wheel's extension-module DLL layout and broke import at runtime).
        # CMAKE_ARGS passes -GNinja straight through to cmake's own CLI, the
        # same way test-cpp's pixi task already does above - this avoids
        # going through the CMAKE_GENERATOR env var, which pixi's win-64
        # cxx-compiler activation script also partially populates (it
        # unconditionally sets CMAKE_GENERATOR_PLATFORM=x64 alongside it),
        # which conflicts with Ninja ("does not support platform
        # specification").
        env:
          CMAKE_ARGS: -GNinja
        run: pixi run test-python

  docs:
    name: Docs (Docusaurus)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: bun install
        run: bun install --frozen-lockfile
      - name: bun run build:cloudflare
        run: bun run build:cloudflare

